services:
  # Option 1: Docker Runtime (Recommended for LightGBM OpenMP support)
  - type: web
    name: aml-cross-border-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "*"
